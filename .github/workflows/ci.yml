name: ci

# 日常 CI（push / PR）：离线测试 + 守门。
# ⚠️ 2026-10-08 起 smoke（c-shared 构建 + 三语言冒烟）**已迁至 release.yml**——
#   它是"发布前验证"，不适合每次 push 都跑；发布链见 release.yml（总控）并复用它
#   调用 release-pypi.yml / release-npm.yml。本文件只留不需要工具链产物的快速门禁。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 依赖漏洞扫描（T4.2）：govulncheck 只报**被调用**的漏洞路径。首次扫描即命中
  # GO-2026-4550（circl 的 secp384r1 CombinedMult，经 utls fork 的 ML-DSA 验证），
  # 已升级 circl v1.6.3 归零；当前噪音低（0 affected + 2 个"模块含但代码未调用"）
  # ⇒ 以阻塞门禁运行。与平台无关，只在 Linux 跑一次。
  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: core/go.sum
      - name: govulncheck (core)
        working-directory: core
        run: |
          set -eu
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  # 测试套件（Linux runner = V-4 要求的那条链路：core 与 e2e 都必须在 Linux 上真实跑过）。
  # 此前 CI 只有 smoke（c-shared + 三语言），**一个测试都没跑**；且 setup-go 用 1.24，
  # 而 tests/e2e/go.mod 要求 go 1.27.0 ⇒ Go 步骤会直接失败。
  test:
    name: ${{ matrix.os }} tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 必须满足**最高**的那个要求：tests/e2e/go.mod = 1.27.0（core 与
          # bindings/golang 是 1.26.0）。用 go.mod 会自动取到 1.26 而失败。
          go-version: '1.27'
          cache-dependency-path: |
            core/go.sum
            tests/e2e/go.sum

      # 版本守门：**四处**字面量必须一致（core/version、pyproject.toml、
      # package.json、绑定 __version__）。0.1.4 及之前的发布清单只写了三处、
      # 漏掉绑定里的 __version__，靠人手同步 ⇒ 这里显式钉住（docs/versioning.md）。
      # 注：pytest 与 node:test 不在本文件（跨语言套件在 oracle-nightly 的 crosslang
      # job；曾经的 tests/smoke 三语言冒烟已迁至 release.yml），
      # 所以这条检查不能只放在 pytest 里，必须在这里跑。
      - name: version literals must agree (四处)
        shell: bash
        run: |
          set -eu
          # tr -d '\r'：Windows runner 上若检出为 CRLF，捕获组会带上 \r，导致比对/与 tag
          # 比较全部假红（与内容无关的平台差异）。
          core=$(sed -n 's/.*Core = "\([^"]*\)".*/\1/p' core/version/version.go | head -1 | tr -d '\r')
          py=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' bindings/python/pyproject.toml | head -1 | tr -d '\r')
          node=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' bindings/nodejs/package.json | head -1 | tr -d '\r')
          pyb=$(sed -n 's/^__version__ = "\([^"]*\)".*/\1/p' bindings/python/geektls/__init__.py | head -1 | tr -d '\r')
          echo "core=$core  pyproject=$py  package.json=$node  __init__=$pyb"
          if [ "$core" != "$py" ] || [ "$core" != "$node" ] || [ "$core" != "$pyb" ]; then
            echo "::error::四处版本字面量不一致（见 docs/versioning.md，四处必须同步）"
            exit 1
          fi
          echo "四处版本一致：$core ✅"

      # 跨平台编译守门（纯 Go 包）：只被"某个 GOOS"暴露的问题必须在这里就红，
      # 而不是等到发版时在 macOS runner 上红。
      # 由来（2026-09-30）：darwin 实现从 sockopt_unix.go（约束 !windows）拆出来时
      # 老文件没同步收窄约束 ⇒ mac 上两份同时编译、符号重名；本地/linux runner 全绿
      # 掩盖了它，直到云编译才炸。这条同时对"平台文件漏覆盖"（BSD 一系一度编不过）
      # 有效。CGO_ENABLED=0 只编纯 Go 包（ffi 是 cgo，跳过）。
      - name: cross-OS compile gate (pure Go)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          pkgs=$(cd core && go list ./... | grep -v '/ffi$' | tr '\n' ' ')
          for t in "linux amd64" "linux arm64" "darwin arm64" "darwin amd64" \
                   "windows amd64" "freebsd amd64"; do
            set -- $t
            echo "== GOOS=$1 GOARCH=$2 =="
            ( cd core && GOOS="$1" GOARCH="$2" CGO_ENABLED=0 go build $pkgs )
          done
          ( cd tests/e2e && GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./... )
          # 平台文件互斥：每个 GOOS 只能编译出上表里的那一份 sockopt 实现
          for os in linux darwin windows freebsd; do
            n=$( ( cd core && GOOS="$os" go list -f '{{join .GoFiles " "}}' ./tcp/ ) \
                 | tr ' ' '\n' | grep -c '^sockopt' )
            if [ "$n" != "1" ]; then
              echo "::error::GOOS=$os 编译到 $n 份 sockopt_*.go（应为 1；见 docs/tcp-platform-matrix.md）"
              exit 1
            fi
          done
          echo "跨平台编译与平台文件互斥检查通过 ✅"

      - name: core vet and test
        working-directory: core
        run: |
          go vet ./...
          go test ./... -timeout 15m

      - name: e2e build vet and test
        working-directory: tests/e2e
        run: |
          go build ./...
          go vet ./...
          go test ./... -timeout 15m

      # 预设守门：core/profiles/builtin 里"由生成器产出"的文件必须逐字节等于
      # 生成器当前输出（防止手改预设后忘记同步生成器，或生成器改动未重跑）。
      # 手写预设（chrome_131_windows/chrome_133_windows/chrome_150_windows、
      # firefox_120_windows/firefox_135_windows、safari_16_macos、safari_18_macos）
      # 不在生成器输出里，会被自动跳过。
      # （2026-09-30 命名统一后旧名成为别名，见 docs/03-profile-format.md §3.1。）
      - name: presets must equal generator output (Linux)
        if: runner.os == 'Linux'
        working-directory: tests/e2e
        run: |
          set -eu
          tmpdir="$(mktemp -d)"
          # 抓包标本 + E1 真浏览器记录一起产出（后者对应 chrome_149_windows /
          # edge_153_windows；H3 记录不参与预设生成，故不列入）。
          go run ./cmd/gen-profiles -out "$tmpdir" \
            -record ../../profiles/evidence/browsers/chrome_windows.json,../../profiles/evidence/browsers/edge_windows.json \
            >/dev/null
          rc=0
          for f in "$tmpdir"/*.json; do
            name="$(basename "$f")"
            if [ ! -f "../../core/profiles/builtin/$name" ]; then
              echo "::error::$name 由生成器产出但未入库"
              rc=1
              continue
            fi
            if ! diff -q "$f" "../../core/profiles/builtin/$name" >/dev/null; then
              echo "::error::$name 与生成器产物不一致（请重跑 gen-profiles 并提交）"
              diff -u "../../core/profiles/builtin/$name" "$f" | head -40 || true
              rc=1
            fi
          done
          exit $rc

  # smoke（c-shared 构建 + 三语言冒烟）已迁至 release.yml 的 smoke job——
  # 那才是它的语义位置（发布前验证）；push 触发的日常 CI 不再构建动态库。
