# PyPI 发布流水线（方案见 docs/plans/2026-09-28-pypi-release-plan.md）
#
# ⚠️ 本文件名必须与 PyPI「可信发布商」里填的**工作流名称**逐字符一致：
#    .github/workflows/release-pypi.yml  ⇒  PyPI 表单填 `release-pypi.yml`
#
# 触发：
#   - push tag v*          → 构建 5 个平台 wheel
#   - workflow_dispatch     → 先发 TestPyPI（正式发布把 publish 步骤的 repository-url 删掉）
#
# 关键点：
#   - Linux 的**动态库**在 manylinux_2_28 容器里构建（决定 wheel 能否标 manylinux_2_28），
#     wheel 本身在 runner 上用现代 Python 组装（manylinux 镜像里的 python 太旧）。
#     ⚠️ step 的 env **不会**进容器：要传的参数必须用 `docker run -e` 显式传（0.1.4 踩过
#     `bash: GOARCH: unbound variable`，容器里 `set -u` 直接失败）。
#   - macOS x86_64 轮子在 **Apple Silicon runner** 上交叉编译（`clang -arch x86_64`）：
#     唯一的 Intel runner `macos-13` 已从 GitHub 托管池下架，用它会永远排队。
#   - ctypes 绑定不依赖 CPython ABI ⇒ 每平台一个 wheel，不需要多解释器矩阵。
#   - 不发布 sdist（从源码构建需要 Go + C 工具链）。
name: release-pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: wheel-${{ matrix.tag }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: manylinux_2_28_x86_64
            runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            goarch: amd64
          - tag: manylinux_2_28_aarch64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            goarch: arm64
          - tag: macosx_11_0_arm64
            runner: macos-14
            goarch: arm64
            ccarch: ""            # 原生构建，不需要 -arch
          # ⚠️ macos-13（最后的 Intel runner）已下架 ⇒ 用它只会一直 "Waiting for a runner"。
          # 改为在 arm64 runner 上用 `clang -arch x86_64` 交叉编译；SDK 是 universal 的，支持。
          # 部署目标 11.0 与 arm64 轮子对齐（Go 1.26 的 darwin 底线也是 11.0，压不到 10.15）。
          - tag: macosx_11_0_x86_64
            runner: macos-14
            goarch: amd64
            ccarch: "-arch x86_64"
          - tag: win_amd64
            runner: windows-2022
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # tag 与四处版本字面量必须一致：否则会出现"tag 是 v0.1.5、包内却写 0.1.4"
      # 这种发布事故（wheel 文件名/元数据/绑定 __version__ 三处互相矛盾）。
      # 只在 tag 触发时校验；workflow_dispatch 手工触发时不拦（但下面仍打印实际值）。
      - name: 版本四处一致 + 与 tag 匹配
        shell: bash
        run: |
          set -eu
          # tr -d '\r'：Windows runner 上若检出为 CRLF，捕获组会带上 \r，与 tag 比较会假红。
          core=$(sed -n 's/.*Core = "\([^"]*\)".*/\1/p' core/version/version.go | head -1 | tr -d '\r')
          py=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' bindings/python/pyproject.toml | head -1 | tr -d '\r')
          node=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' bindings/nodejs/package.json | head -1 | tr -d '\r')
          pyb=$(sed -n 's/^__version__ = "\([^"]*\)".*/\1/p' bindings/python/geektls/__init__.py | head -1 | tr -d '\r')
          echo "core=$core  pyproject=$py  package.json=$node  __init__=$pyb"
          if [ "$core" != "$py" ] || [ "$core" != "$node" ] || [ "$core" != "$pyb" ]; then
            echo "::error::四处版本字面量不一致（见 docs/versioning.md，四处必须同步）"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$core" ]; then
              echo "::error::tag v$tag 与版本源 $core 不一致（先把四处改成 $tag 再打 tag）"
              exit 1
            fi
            echo "tag v$tag == 版本源，一致 ✅"
          fi

      # ---------- 1) 构建动态库 ----------
      # 容器里不联网下 Go：直接把 runner 上 setup-go 装好的**同一套工具链**挂进去。
      # 好处：版本跟着 core/go.mod（不漂移）、省一次 ~90MB 下载、避开容器出网的不确定性。
      # 注意 glibc 底线由容器决定（cgo 用容器里的 gcc 链接），宿主只提供编译器本体。
      - name: 预热 Go 模块缓存（容器内复用同一份）
        if: runner.os == 'Linux'
        shell: bash
        run: cd core && go mod download

      - name: 构建动态库（Linux：容器内满足 manylinux_2_28 基线）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          GOROOT_HOST="$(go env GOROOT)"
          GOMODCACHE_HOST="$(go env GOMODCACHE)"
          GOVER="$(go env GOVERSION)"; GOVER="${GOVER#go}"
          # --user 用当前 uid：否则容器里以 root 产出 build/libgeektls.so，
          # 后续宿主步骤虽然能读，但清理/覆盖时会踩权限。
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/w" -w /w \
            -v "$GOROOT_HOST:$GOROOT_HOST:ro" \
            -v "$GOMODCACHE_HOST:$GOMODCACHE_HOST" \
            -e GOROOT="$GOROOT_HOST" \
            -e GOMODCACHE="$GOMODCACHE_HOST" \
            -e GOCACHE=/tmp/gocache \
            -e HOME=/tmp \
            -e GOOS=linux \
            -e GOARCH="${{ matrix.goarch }}" \
            -e GOVER="$GOVER" \
            -e CGO_ENABLED=1 \
            "${{ matrix.container }}" \
            bash -c '
              set -euo pipefail
              export PATH="$GOROOT/bin:$PATH"
              # 挂载的工具链若是因 glibc 太旧跑不起来，退回容器内下载同版本（不再靠 go.dev/VERSION
              # 取 latest，避免和 core/go.mod 漂移）。
              if ! go version; then
                echo "挂载的 Go 不可用，改为容器内下载 go${GOVER}"
                curl -sSL "https://go.dev/dl/go${GOVER}.linux-${GOARCH}.tar.gz" -o /tmp/go.tgz
                tar -C /usr/local -xzf /tmp/go.tgz
                export GOROOT=/usr/local/go
                export PATH="$GOROOT/bin:$PATH"
                go version
              fi
              mkdir -p build
              cd core && go build -buildmode=c-shared -trimpath -ldflags "-s -w" -o ../build/libgeektls.so ./ffi
            '

      - name: 校验 glibc 基线（决定 manylinux_2_28 这个标签能不能用）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          VERS=$(objdump -T build/libgeektls.so | grep -oE 'GLIBC_[0-9.]+' | sed 's/^GLIBC_//' | sort -uV)
          echo "libgeektls.so 引用的 GLIBC 符号版本：$(echo "$VERS" | tr '\n' ' ')"
          # ⚠️ 只能按版本号逐段数值比较。字典序会误判：'GLIBC_2.3.2' > 'GLIBC_2.28'
          #（第 8 位 3 > 2），而 2.3.2 其实是 glibc 最老的符号版本之一。
          TOO_NEW=$(echo "$VERS" | awk -F. '($1 > 2) || ($1 == 2 && $2 > 28) {print; exit}')
          if [ -n "$TOO_NEW" ]; then
            echo "::error::出现高于 2.28 的 GLIBC 符号（$TOO_NEW），不能标 manylinux_2_28"
            exit 1
          fi
          echo "基线 OK：全部符号 ≤ GLIBC_2.28"

      - name: 构建动态库（macOS；x86_64 走交叉编译）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          make build
          # 架构断言：交叉编译最怕"编译成功但产出宿主架构"，那会让 wheel 标签说谎。
          lipo -info build/libgeektls.dylib
          case "${{ matrix.goarch }}" in
            amd64) lipo -info build/libgeektls.dylib | grep -q x86_64 ;;
            arm64) lipo -info build/libgeektls.dylib | grep -q arm64 ;;
          esac
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CC: clang
          # clang 默认按宿主架构出目标文件；交叉目标是 x86_64 时必须显式指定编译+链接两侧。
          CGO_CFLAGS: ${{ matrix.ccarch }}
          CGO_LDFLAGS: ${{ matrix.ccarch }}
          CGO_ENABLED: "1"
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - name: 安装 mingw 并构建动态库（Windows）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install mingw -y --no-progress
          echo "C:/ProgramData/mingw64/mingw64/bin" >> "$GITHUB_PATH"
          echo "CGO_ENABLED=1" >> "$GITHUB_ENV"
          mkdir -p build
          cd core && go build -buildmode=c-shared -trimpath -ldflags "-s -w" -o ../build/geektls.dll ./ffi

      # ---------- 2) 组装 wheel ----------
      - name: 组装 wheel
        shell: bash
        run: |
          set -euo pipefail
          # 关键清理（0.1.0 踩过两次坑）：
          # 1) setuptools 的暂存目录 bindings/python/build/lib/ 会残留旧平台动态库，
          #    只清包目录不够——它会把 .dll/.so 一起打进 wheel；
          # 2) dist 里的旧文件会让后续步骤/上传拿到错的包。
          rm -rf bindings/python/build bindings/python/dist
          rm -f bindings/python/geektls/*.dll bindings/python/geektls/*.so bindings/python/geektls/*.dylib
          cp build/*geektls.* bindings/python/geektls/
          cp README.md bindings/python/README.md
          python -m pip install --upgrade build wheel
          cd bindings/python
          python -m build --wheel
          # --remove：删掉用不得的 py3-none-any 版本，避免它被一起传上 PyPI
          python -m wheel tags --remove --platform-tag "${{ matrix.tag }}" dist/*.whl
          ls -l dist/

      - name: 校验（安装到干净 venv 并跑 version + 预设枚举）
        shell: bash
        run: |
          set -euo pipefail
          WHEEL=$(ls bindings/python/dist/*.whl)
          # 文件名里的平台标签必须与预期一致（历史上出过 py3-none-any 混进来的事）
          case "$WHEEL" in
            *"${{ matrix.tag }}.whl") ;;
            *) echo "::error::wheel 标签不符：$WHEEL（期望 ${{ matrix.tag }}）"; exit 1 ;;
          esac
          if [ "$RUNNER_OS" = "macOS" ] && [ "${{ matrix.goarch }}" = "amd64" ]; then
            # 交叉构建出来的 x86_64 轮子：宿主 runner 是 arm64，用 arm64 解释器 import
            # 必然报 "incompatible architecture"。所以先拆包静态断言架构，再尽量借
            # Rosetta 起一个 x86_64 解释器做真加载；没 Rosetta 就只做静态断言。
            unzip -o -q "$WHEEL" -d /tmp/wheel-x64
            DY=$(find /tmp/wheel-x64 -name '*.dylib')
            lipo -info "$DY"
            lipo -info "$DY" | grep -q x86_64
            if arch -x86_64 true 2>/dev/null && [ -x /usr/bin/python3 ]; then
              arch -x86_64 /usr/bin/python3 -m venv /tmp/v
              PY="arch -x86_64 /tmp/v/bin/python"
            else
              echo "::warning::runner 无 Rosetta/system python3，跳过 x86_64 运行期校验（架构已由 lipo 断言）"
              exit 0
            fi
          else
            python -m venv /tmp/v
            if [ -x /tmp/v/bin/python ]; then PY=/tmp/v/bin/python; else PY=/tmp/v/Scripts/python; fi
          fi
          $PY -m pip install --quiet "$WHEEL"
          $PY -c "import geektls,json;print(json.dumps(geektls.version()));print(len(geektls.list_presets()))"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.tag }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  publish:
    needs: build
    # 部分平台构建失败时也要把成功的那些发出去（配合 skip-existing，重跑即可补齐）
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # 用 token 发布：不需要 PyPI 可信发布商、不需要 environment
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      # 发布物白名单：只有"当前版本号 + build 矩阵里那 5 个平台标签"的 wheel 允许进 PyPI。
      # 动机（0.1.4 实录）：同一个版本上混进过一个**本地构建**的 manylinux_2_34_x86_64，
      # 现代 glibc 上 pip 会优先选它、而不是 CI 在 manylinux_2_28 容器里构建的那个
      # （本地机的 .so 引用的 GLIBC 最高 2.34，打 2_28 标签属"谎标签"）。
      # ⚠️ PyPI **没有 yank 的 API**（只能网页操作）⇒ 唯一的程序化防线就是"别上传"。
      # 同一套检查也给手动上传用：scripts/check-release-wheels.sh
      - name: 发布物白名单校验
        shell: bash
        env:
          # ⚠️ 必须与上面 build 的 matrix 逐项一致（matrix 无法跨 job 引用）
          ALLOWED_TAGS: "manylinux_2_28_x86_64 manylinux_2_28_aarch64 macosx_11_0_arm64 macosx_11_0_x86_64 win_amd64"
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' bindings/python/pyproject.toml | head -1 | tr -d '\r')
          echo "版本源：$ver；白名单：$ALLOWED_TAGS"
          rc=0
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -eq 0 ]; then
            echo "::error::dist/ 里没有 wheel"; exit 1
          fi
          for f in "${wheels[@]}"; do
            base=$(basename "$f")
            tag="${base#geektls-$ver-py3-none-}"
            if [ "$tag" = "$base" ]; then
              echo "::error::$base 命名不符合 geektls-$ver-py3-none-<标签>.whl"; rc=1; continue
            fi
            tag="${tag%.whl}"
            case " $ALLOWED_TAGS " in
              *" $tag "*) echo "  ✅ $base" ;;
              *) echo "::error::$base 的平台标签 $tag 不在白名单里（拒绝上传）"; rc=1 ;;
            esac
          done
          exit $rc
      - name: 发布到 PyPI
        # 认证：仓库 Secret `PYPI_API_TOKEN`（PyPI 项目级 token）
        # 想改成 OIDC 免 token：删掉 user/password 两行，换回
        #   permissions: { id-token: write }  +  environment: pypi  + PyPI 可信发布商
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true
          # 已发布的文件（如 0.1.0 的 Windows wheel）跳过而不是报错，
          # 这样补发其他平台时可以把它们加到**同一个版本**上。
          skip-existing: true
          # 想先试跑 TestPyPI 就加上这一行：
          # repository-url: https://test.pypi.org/legacy/
