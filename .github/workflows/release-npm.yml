name: release-npm

# npm 发布流水线（与 release-pypi.yml 对应）：三平台 runner 各自构建 c-shared
# 动态库（Go 的 c-shared 不能交叉编译 ⇒ 必须在对应平台构建），汇总进
# bindings/nodejs 后 npm publish。
#
# 触发：
#   - push tag `npm/v*`   → 构建 + 发布（正式发版用）
#   - workflow_dispatch   → 默认只"组包 + npm pack 自检"不发布（npm 发布后
#     不可撤回，误发只能 deprecate）；inputs.publish=true 才真发。
#   - workflow_call       → 供发布总控（release.yml）复用：版本同步后直接调用
#     （GITHUB_TOKEN 推的 npm/v* tag 不会触发本 workflow，故用显式调用）。
#
# 需要 secret：NPM_TOKEN（npmjs.com → Access Tokens → Generate（Publish 权限））。
#
# 平台覆盖（第一版）：Windows x64 / Linux x64 / macOS Apple Silicon (arm64)。
# ⚠️ Intel Mac 暂不支持：macos-latest 是 Apple Silicon；按架构分发需要改
#    index.js 的库名选择（拼 process.arch），属于 P7 的活——README 已如实标注。

on:
  push:
    tags:
      - 'npm/v*'
  workflow_dispatch:
    inputs:
      publish:
        description: '手动触发时是否真的 publish（默认 false = 只组包自检）'
        required: false
        default: 'false'
  workflow_call:
    inputs:
      ref:
        description: '检出并发布的 ref（总控调用传 main；tag/dispatch 触发留空）'
        required: false
        type: string
        default: ''
      version:
        description: '期望的 package.json 版本（总控调用必传，用于发布前断言）'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: nodejs-lib-linux
          - os: windows-latest
            artifact: nodejs-lib-windows
          - os: macos-latest
            artifact: nodejs-lib-macos
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: core/go.sum

      # c-shared 在 Windows 上需要 gcc + make（与 ci.yml / oracle-nightly 的
      # crosslang job 同一套；windows runner 不预装 make）。
      - name: Install toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y --no-progress make mingw
          Import-Module $env:ChocolateyInstall\helpers\chocolateyProfile.psm1
          Update-SessionEnvironment
          Add-Content $env:GITHUB_PATH (Split-Path (Get-Command gcc).Source)

      - name: Build core (c-shared)
        run: make build

      - name: Collect dynamic library
        shell: bash
        run: |
          set -eu
          case "${{ runner.os }}" in
            Linux)  lib=libgeektls.so ;;
            macOS)  lib=libgeektls.dylib ;;
            Windows) lib=geektls.dll ;;
            *) echo "::error::未知平台"; exit 1 ;;
          esac
          test -f "build/$lib" || { echo "::error::build/$lib 不存在（make build 失败？）"; exit 1; }
          mkdir -p out
          cp "build/$lib" "out/$lib"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/
          if-no-files-found: error

  publish:
    name: assemble & publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # npm provenance（包页 Verified 徽章）需要 OIDC。
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # T4.1 Trusted Publishing（OIDC 免 token）：npm CLI ≥ 11.5.1 才支持；
      # node 20 自带的 npm 10 需要升级。npm 侧配置 Trusted Publisher 后
      #（Settings → Trusted Publisher → GitHub Actions → geekbyter/geektls →
      # 本 workflow 名），`npm publish` 会优先用 OIDC 并忽略 NODE_AUTH_TOKEN；
      # 迁移期 NPM_TOKEN 保留为回退（未配置 Trusted Publisher 时照旧可用）。
      # 判据：下一次 npm 发版（npm/v*）无 secret 参与也成功。
      # ⚠️ 钉 `npm@11` 而非 `@latest`（2026-10-09 发布踩坑）：npm@12 的 engines
      # 要求 Node ^22.22.2 || ^24.15.0 || >=26，node 20 runner 直接 EBADENGINE；
      # npm 11（最新已 ≥11.5.1）既满足 trusted publishing 又兼容 node 20。
      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@11

      - uses: actions/download-artifact@v4
        with:
          pattern: nodejs-lib-*
          path: artifacts/

      # 组包：三平台库 + 许可文件。npm 只自动带包根 LICENSE；LICENSES.md 必须落在
      # 包目录（package.json 的 files 列表已含两者）。
      - name: Assemble package directory
        shell: bash
        run: |
          set -eu
          cp artifacts/nodejs-lib-linux/libgeektls.so    bindings/nodejs/
          cp artifacts/nodejs-lib-macos/libgeektls.dylib bindings/nodejs/
          cp artifacts/nodejs-lib-windows/geektls.dll    bindings/nodejs/
          cp LICENSE LICENSES.md bindings/nodejs/
          ls -la bindings/nodejs/

      # 版本一致性：tag 触发对 tag；总控（workflow_call）对 inputs.version；
      # dispatch 自检模式（未传 version）跳过断言。
      - name: Version must match tag / release input
        shell: bash
        run: |
          set -eu
          got=$(node -p "require('./bindings/nodejs/package.json').version")
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            want="${GITHUB_REF_NAME#npm/v}"
          elif [ -n "${{ inputs.version }}" ]; then
            want="${{ inputs.version }}"
          else
            echo "非 tag 触发且未传 version（自检模式），跳过断言；当前 $got"
            exit 0
          fi
          if [ "$got" != "$want" ]; then
            echo "::error::package.json version ($got) ≠ $want——先同步版本源再发布"
            exit 1
          fi

      # 发布自检：npm pack 清单必须包含三平台库、许可与入口（缺任何一件都不发）。
      - name: Pack & verify contents
        shell: bash
        working-directory: bindings/nodejs
        run: |
          set -eu
          npm pack --dry-run > /tmp/pack.log 2>&1 || { cat /tmp/pack.log; exit 1; }
          cat /tmp/pack.log
          for f in libgeektls.so libgeektls.dylib geektls.dll LICENSE LICENSES.md index.js index.d.ts package.json; do
            grep -q "$f" /tmp/pack.log || { echo "::error::包里缺 $f"; exit 1; }
          done
          echo "包内容自检通过"

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/npm/v') || github.event.inputs.publish == 'true' || github.event_name == 'workflow_call'
        shell: bash
        working-directory: bindings/nodejs
        env:
          # Trusted Publishing 配置后 OIDC 优先、此 token 被忽略（见上方
          # Upgrade npm 步骤注释）；保留为迁移期回退。
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
